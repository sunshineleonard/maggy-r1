<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
<title>Maggy</title>
<style>
  /* Rabbit R1 build: the whole 240x292 screen is the jar. System fonts only (outside fonts don't load reliably on the R1). */
  :root { --mood: #ffb547; }
  html, body { margin: 0; background: #0e0e10; color: #f3e6d6; overflow: hidden; }
  body { width: 240px; height: 292px; font-family: -apple-system, "Segoe UI", sans-serif; }
  .stage { position: relative; width: 240px; height: 292px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
  canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .say { position: absolute; left: 14px; right: 14px; top: 30px; margin: 0; text-align: center; pointer-events: none;
    font: 700 16px/1.15 "Comic Sans MS", "Chalkboard SE", "Segoe Print", cursive; color: #fff6ea;
    text-shadow: 0 0 6px var(--mood), 0 1px 3px rgba(0,0,0,.9); opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s; }
  .say.on { opacity: 1; transform: none; }
  .steps { position: absolute; left: 6px; right: 6px; bottom: 3px; margin: 0; font: 9px/1.2 ui-monospace, monospace; color: rgba(255,246,234,.55); pointer-events: none; text-shadow: 0 1px 2px #000; }
  .say.long { font-size: 13px; line-height: 1.2; top: 22px; }
  .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px;
    color: #a8968a; font-size: 13px; background: #0e0e10; }
  .hidden-panel { display: none; }
  [hidden] { display: none !important; }
  /* menu button + settings panel */
  .menu-btn { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; border: 0; z-index: 20;
    background: rgba(14,14,16,.55); color: #fff6ea; font: 700 16px/30px -apple-system, "Segoe UI", sans-serif; padding: 0; box-shadow: 0 0 0 1px rgba(255,246,234,.25); }
  .menu { position: absolute; inset: 0; z-index: 30; background: rgba(10,9,12,.9); padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 7px; }
  .menu h2 { margin: 0 0 2px; font-size: 14px; color: var(--mood); }
  .menu .row { display: flex; align-items: center; gap: 6px; }
  .menu button { font: 600 13px -apple-system, "Segoe UI", sans-serif; color: #fff6ea; background: #2a2630; border: 0; border-radius: 8px; padding: 0 10px; min-height: 34px; }
  .menu button.wide { width: 100%; text-align: left; }
  .menu button[aria-pressed="true"] { background: #4a3a20; }
  .menu button:disabled { opacity: .4; }
  .vol { flex: 1; text-align: center; font: 12px ui-monospace, monospace; color: #ffb547; }
  .vol small { display: block; color: #a8968a; font-size: 10px; }
  .hint { font-size: 10px; color: #a8968a; margin: 0; }
  /* transcript: terminal look; .turnR/.turnL = R1 held sideways */
  .log { position: absolute; left: 0; top: 0; width: 240px; height: 292px; z-index: 40; background: #050806; color: #8dff9a; box-sizing: border-box;
    display: flex; flex-direction: column; font: 11px/1.35 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .log.turnR, .log.turnL { width: 292px; height: 240px; left: -26px; top: 26px; }
  .log.turnR { transform: rotate(90deg); } .log.turnL { transform: rotate(-90deg); }
  .log-top { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; border-bottom: 1px solid #1d3a22; color: #ffb547; }
  .log-top button { font: 11px ui-monospace, monospace; color: #8dff9a; background: #102414; border: 0; border-radius: 4px; padding: 4px 7px; margin-left: 4px; }
  .log-body { flex: 1; overflow-y: auto; padding: 4px 7px 10px; white-space: pre-wrap; word-break: break-word; }
  .log .ln { margin: 0 0 5px; } .log .you { color: #e6f7ff; } .log .maggy { color: #8dff9a; } .log .sys { color: #ff8a7a; } .log .cc { color: #9ec7ff; }
  .log-type { display: flex; align-items: center; gap: 4px; border-top: 1px solid #1d3a22; padding: 4px 6px; margin: 0; }
  .log-type span { color: #ffb547; }
  .log-type input { flex: 1; min-width: 0; background: #0b140d; color: #e6f7ff; border: 1px solid #1d3a22; border-radius: 4px; font: 12px ui-monospace, monospace; padding: 5px 6px; }
  .log-type input:focus { outline: 1px solid #8dff9a; }
  .log-type button { font: 11px ui-monospace, monospace; color: #050806; background: #8dff9a; border: 0; border-radius: 4px; padding: 5px 8px; }
  /* Maggy's own keyboard: drawn inside the transcript so it turns with it (the R1's keyboard is always portrait) */
  .kb { display: flex; flex-direction: column; gap: 3px; padding: 3px 3px 4px; background: #0b140d; border-top: 1px solid #1d3a22; }
  .kb .kr { display: flex; gap: 3px; justify-content: center; }
  .kb button { flex: 1 1 0; min-width: 0; height: 25px; padding: 0; border: 0; border-radius: 4px; background: #16301b; color: #d8ffe0;
    font: 13px ui-monospace, monospace; touch-action: manipulation; }
  .kb button.wide { flex-grow: 1.6; } .kb button.space { flex-grow: 4.5; } .kb button.go { background: #8dff9a; color: #050806; font-weight: 700; }
  .kb button.on { background: #4a3a20; color: #ffb547; } .kb button:active { background: #2f6a38; }
  .log.typing .log-body { min-height: 0; }
  .log .pending { color: #3f7a48; font-style: italic; }
  .log .ts { color: #3f7a48; font-size: 9px; } .log .day { color: #ffb547; text-align: center; margin: 4px 0; font-size: 10px; }
</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="c" aria-label="Maggy in her jar"></canvas>
  <p class="say" id="say" aria-live="polite"></p>
  <p class="steps" id="steps"></p>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu">☰</button>
  <div class="menu" id="menu" hidden>
    <div class="row"><h2 style="flex:1">Maggy's settings</h2><button id="closeMenu" type="button" aria-label="Close menu">✕</button></div>
    <div class="row"><button id="volDown" type="button" aria-label="Quieter">−</button>
      <div class="vol"><span id="volBars"></span><small>volume <span id="volNum"></span></small></div>
      <button id="volUp" type="button" aria-label="Louder">+</button></div>
    <button class="wide" id="muteBtn" type="button" aria-pressed="false">Voice: ON</button>
    <div class="row"><button class="wide" id="replayBtn" type="button" style="flex:1">Say again (free)</button><button class="wide" id="logBtn" type="button" style="flex:1">Transcript</button></div>
    <button class="wide" id="trackBtn" type="button" aria-pressed="false">Head tracking: OFF</button>
    <p class="hint">Head tracking uses the camera and more battery. Turn the R1 sideways for the transcript.</p>
  </div>
  <section class="log" id="log" hidden aria-label="Transcript">
    <div class="log-top"><span>maggy@jar:~$ log</span><span><button id="logClear" type="button">clear</button><button id="logClose" type="button">close</button></span></div>
    <div class="log-body" id="logBody"></div>
    <form class="log-type" id="typeForm" autocomplete="off"><span>&gt;</span><input id="typeIn" type="text" maxlength="500" placeholder="tap here to type to Maggy…" inputmode="none" readonly><button type="submit">send</button></form>
    <div class="kb" id="kb" hidden></div>
  </section>
  <div class="loading" id="loading">Waking Maggy up…</div>
</main>
<!-- the desktop page's test controls; kept hidden so the shared scene code runs unchanged -->
<section class="hidden-panel" aria-hidden="true">
  <b id="moodName"></b><b id="clipName"></b><span id="why"></span><b id="fps"></b>
  <div id="moodRow"></div><div id="lightRow"></div>
</section>
<script>window.MAGGY_BUILD = "BUILD_STAMP";</script>
<script src="app.js?v=BUILD_STAMP"></script>
</body>
</html>
